<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>구구단 레벨업 - 관리자</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="dot">✕</span> 구구단 레벨업 <span class="tag">관리자</span></div>
  <nav>
    <a href="/board.html">게시판</a>
    <a href="/index.html">학생 로그인</a>
    <button class="link" id="logout-btn" style="display:none">로그아웃</button>
  </nav>
</header>

<div class="wrap">
  <div id="loading" class="loading">불러오는 중...</div>

  <div id="view-setup" class="wrap narrow" style="display:none;padding:0">
    <div class="card">
      <h2 class="mt0">관리자 비밀번호 설정</h2>
      <p class="muted" style="font-size:0.9rem">처음 실행이에요. 관리자 비밀번호를 설정해주세요.</p>
      <form id="setup-form">
        <label for="setup-pw">비밀번호 (4자 이상)</label>
        <input type="password" id="setup-pw" required minlength="4" />
        <button class="btn" type="submit" style="width:100%">설정하고 시작하기</button>
        <div class="error-box" id="setup-err"></div>
      </form>
    </div>
  </div>

  <div id="view-login" class="wrap narrow" style="display:none;padding:0">
    <div class="card">
      <h2 class="mt0">관리자 로그인</h2>
      <form id="login-form">
        <label for="login-pw">비밀번호</label>
        <input type="password" id="login-pw" required />
        <button class="btn" type="submit" style="width:100%">로그인</button>
        <div class="error-box" id="login-err"></div>
      </form>
    </div>
  </div>

  <div id="view-dashboard" style="display:none"></div>
</div>

<footer class="foot">구구단 레벨업 &middot; 관리자 페이지</footer>

<script src="/js/common.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
